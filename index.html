<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>🔴 LIVE</title>
<style>
:root{--pur:#9147ff;--red:#eb0400}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;color:#fff;font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden;overscroll-behavior:none}
#vid{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#111}
#vid.mirror{transform:scaleX(-1)}
.nocam{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:radial-gradient(circle at 50% 40%,#2a1650,#050508);text-align:center;padding:20px}
.nocam button{background:var(--pur);color:#fff;border:0;border-radius:8px;padding:12px 18px;font-weight:700;font-size:16px}
.shade-top{position:fixed;left:0;right:0;top:0;height:120px;background:linear-gradient(rgba(0,0,0,.55),transparent);pointer-events:none}
.shade-bot{position:fixed;left:0;right:0;bottom:0;height:55%;background:linear-gradient(transparent,rgba(0,0,0,.6));pointer-events:none}
/* top bar */
.top{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 10px) 12px 0;display:flex;align-items:center;gap:8px}
.ava{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#ff6ec7,#9147ff);border:2px solid var(--red);display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.who{min-width:0}
.who b{font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 3px #000}
.who small{font-size:11px;color:#ddd;text-shadow:0 1px 3px #000}
.pill{background:rgba(0,0,0,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:6px;padding:4px 8px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.live{background:var(--red);border-radius:4px;padding:3px 6px;font-size:11px;font-weight:800;letter-spacing:.5px}
.dot{width:7px;height:7px;border-radius:50%;background:#fff;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
.sp{flex:1}
.icon{width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.45);backdrop-filter:blur(6px);border:0;color:#fff;font-size:17px;flex:none}
/* goal */
.goal{position:fixed;left:12px;top:calc(env(safe-area-inset-top) + 58px);width:min(210px,55vw);background:rgba(0,0,0,.45);backdrop-filter:blur(6px);border-radius:8px;padding:6px 8px;font-size:11px;font-weight:700}
.goal .r{display:flex;justify-content:space-between;color:#ddd;margin-top:2px}
.bar{height:6px;background:rgba(255,255,255,.2);border-radius:3px;margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#9147ff,#ff4fd8);width:0;transition:width .8s}
/* alert */
.alert{position:fixed;left:50%;top:26%;transform:translate(-50%,-20px) scale(.85);opacity:0;transition:all .4s cubic-bezier(.2,1.5,.4,1);width:88%;max-width:420px;text-align:center;pointer-events:none;background:rgba(20,10,40,.72);backdrop-filter:blur(8px);border:2px solid var(--pur);border-radius:14px;padding:12px 14px;box-shadow:0 0 30px rgba(145,71,255,.55)}
.alert.show{opacity:1;transform:translate(-50%,0) scale(1)}
.alert .g{font-size:40px;animation:wob .6s ease-in-out infinite alternate}
@keyframes wob{from{transform:rotate(-8deg)}to{transform:rotate(8deg) scale(1.1)}}
.alert .t{font-size:18px;font-weight:900}
.alert .t em{font-style:normal;color:#ffd24a}
.alert .m{font-size:15px;font-weight:600;margin-top:4px;line-height:1.3}
/* chat */
#chat{position:fixed;left:10px;right:70px;bottom:calc(env(safe-area-inset-bottom) + 62px);max-height:42%;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;-webkit-mask-image:linear-gradient(transparent,#000 30%);mask-image:linear-gradient(transparent,#000 30%);pointer-events:none}
.msg{font-size:14px;line-height:1.3;text-shadow:0 1px 3px #000,0 0 2px #000;animation:in .25s;word-wrap:break-word}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.msg .u{font-weight:800}
.badge{display:inline-block;width:15px;height:15px;border-radius:3px;background:var(--pur);font-size:9px;text-align:center;line-height:15px;margin-right:3px;vertical-align:1px}
.b-mod{background:#00ad03}
.msg.sys{background:rgba(145,71,255,.35);border-left:3px solid var(--pur);padding:4px 7px;border-radius:4px;font-weight:600;align-self:flex-start}
.msg.don{background:rgba(255,190,0,.28);border-left:3px solid #ffd24a;padding:4px 7px;border-radius:4px;align-self:flex-start}
.msg.don b{color:#ffd24a}
/* bottom input */
.bot{position:fixed;left:0;right:0;bottom:0;padding:8px 10px calc(env(safe-area-inset-bottom) + 10px);display:flex;gap:8px;align-items:center}
.bot input{flex:1;background:rgba(0,0,0,.45);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.25);border-radius:20px;padding:10px 14px;color:#fff;font-size:15px}
.bot input::placeholder{color:#ccc}
.bot input:focus{outline:0;border-color:var(--pur)}
.hearts{position:fixed;right:14px;bottom:calc(env(safe-area-inset-bottom) + 64px);width:44px;height:300px;pointer-events:none}
.heart{position:absolute;bottom:0;left:10px;font-size:22px;animation:fly 2.6s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),-280px) scale(1.3);opacity:0}}
.hint{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.55);padding:8px 14px;border-radius:20px;font-size:13px;font-weight:600;pointer-events:none;transition:opacity .5s}
</style>
</head>
<body>
<video id="vid" autoplay playsinline muted></video>
<div class="nocam" id="nocam" hidden>
  <div style="font-size:44px">📷</div>
  <div>Разрешите доступ к камере,<br>чтобы начать трансляцию</div>
  <button id="camBtn">Включить камеру</button>
</div>
<div class="shade-top"></div><div class="shade-bot"></div>

<div class="top">
  <div class="ava">😎</div>
  <div class="who"><b id="name"></b><small>IRL · Пранки на улице</small></div>
  <span class="sp"></span>
  <span class="live">LIVE</span>
  <span class="pill">👁 <span id="views">0</span></span>
  <span class="pill"><span class="dot"></span><span id="up">0:00</span></span>
  <button class="icon" id="flip" title="Сменить камеру">🔄</button>
</div>

<div class="goal">🎯 <span id="goalName">На новый телефон</span>
  <div class="bar"><i id="gbar"></i></div>
  <div class="r"><span id="gnow">0 ₽</span><span id="gmax">15 000 ₽</span></div>
</div>

<div class="alert" id="alert"><div class="g" id="ag">💸</div><div class="t" id="at"></div><div class="m" id="am"></div></div>
<div id="chat"></div>
<div class="hearts" id="hearts"></div>
<div class="hint" id="hint">🔊 Нажми, чтобы включить звук</div>

<div class="bot"><input id="say" placeholder="Написать в чат…" maxlength="150" enterkeyhint="send"></div>

<script>
const $=id=>document.getElementById(id);
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const ri=(a,b)=>Math.floor(a+Math.random()*(b-a+1));
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>n.toLocaleString('ru-RU');
const P=new URLSearchParams(location.search);
const NAME=P.get('name')||'sanya_irl';
$('name').textContent=NAME;document.title='🔴 '+NAME+' — LIVE';
if(P.get('goal'))$('goalName').textContent=P.get('goal');

/* --- camera (rear by default) --- */
let facing=P.get('cam')==='front'?'user':'environment',stream=null;
async function cam(){
  try{
    if(stream)stream.getTracks().forEach(t=>t.stop());
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1920},height:{ideal:1080}},audio:false});
    $('vid').srcObject=stream;$('vid').classList.toggle('mirror',facing==='user');$('nocam').hidden=true;
  }catch(e){$('nocam').hidden=false}
}
$('camBtn').onclick=cam;
$('flip').onclick=e=>{e.stopPropagation();facing=facing==='user'?'environment':'user';cam()};
cam();

/* --- viewers & uptime (small streamer) --- */
let viewers=ri(45,90);const t0=Date.now()-ri(4,25)*60e3;
setInterval(()=>{viewers=Math.max(18,viewers+ri(-3,4));if(Math.random()<.03)viewers+=ri(8,25);$('views').textContent=viewers},2500);
$('views').textContent=viewers;
setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000),h=Math.floor(s/3600),m=Math.floor(s/60)%60,ss=String(s%60).padStart(2,'0');$('up').textContent=h?`${h}:${String(m).padStart(2,'0')}:${ss}`:`${m}:${ss}`},1000);

/* --- chat --- */
const users=['kotik228','sanya_pro','Liza_nya','bratishka','vasyan_play','zloy_hamster','top4ik','dev_senior','nikita_gg','Tanya_UwU','ded_inside','OlegLOL','bober_kurwa','Mashenka','lagger3000','Dimas_77','ne_spal','koshka_mura','artemka','kirill_ultra'];
const ucol=['#ff5c5c','#4fa3ff','#3dff8a','#ff7ac8','#ffcc33','#b4ff4f','#ff9a5c','#6ef0ff','#c08bff','#ffd700'];
const colOf={};users.forEach(u=>colOf[u]=rnd(ucol));
const phr=['кто это? 😂','привет прохожему 👋','скажи ему что он в прямом эфире','спроси как зовут','поздоровайся с чатом!','хахахаха','ору 😂😂','он не понял что происходит','KEKW','передай привет от чата','ахах лицо его','ну всё, он теперь звезда','пусть помашет в камеру!','спроси откуда он','+++','LUL','чат, он милый','давай следующего!','это лучший стрим','я с работы смотрю','ахахах он засмущался','спроси его чем занимается','скажи что у тебя 10к зрителей 😂','ЛЕГЕНДА','💜💜💜','@'+NAME+' красава','он думает это пранк 😏','пусть скажет что-нибудь чату','чат, пишите ему привет!','привет!!! 👋👋','привеет','хай 👋','спроси у него совет по жизни','скажи чтоб станцевал 💃','это где вообще?','город какой?','вот это реакция 😂','W прохожий','GG','лайк за прохожего ❤️'];
const chat=$('chat');
function add(html,cls=''){const d=document.createElement('div');d.className='msg '+cls;d.innerHTML=html;chat.appendChild(d);while(chat.children.length>25)chat.firstChild.remove()}
function line(){const u=rnd(users);const b=Math.random()<.35?'<span class="badge">★</span>':'';add(`${b}<span class="u" style="color:${colOf[u]}">${u}</span>: ${esc(rnd(phr))}`)}
(function loop(){line();setTimeout(loop,ri(1200,4200))})();

function send(){const v=$('say').value.trim();if(!v)return;add(`<span class="badge b-mod">⚔</span><span class="u" style="color:#bf94ff">${esc(NAME)}</span>: ${esc(v)}`);$('say').value='';
  setTimeout(()=>add(`<span class="u" style="color:${rnd(ucol)}">${rnd(users)}</span>: ${rnd(['+++','ахах да','согласен','😂😂','ну ты даёшь','ЛЕГЕНДА'])}`),ri(700,1600))}
$('say').onkeydown=e=>{if(e.key==='Enter'){send();$('say').blur()}};

/* --- follows / subs (rare) --- */
setInterval(()=>{const u=rnd(users),r=Math.random();
  if(r<.6)add(`💜 <b>${u}</b> теперь отслеживает канал!`,'sys');
  else add(`⭐ <b>${u}</b> оформил(а) подписку!`,'sys');},ri(35000,60000));

/* --- hearts --- */
function heart(){const h=document.createElement('div');h.className='heart';h.textContent=rnd(['💜','❤️','💗','🔥','😂']);h.style.setProperty('--dx',ri(-30,10)+'px');$('hearts').appendChild(h);setTimeout(()=>h.remove(),2700)}
setInterval(()=>{if(Math.random()<.6)heart()},900);

/* --- donations (small) --- */
const donMsgs=['Передай прохожему привет от чата!','Спроси как у него дела 🙂','Пусть помашет в камеру 👋','Прохожему на кофе ☕','Скажи ему что он красавчик','Пусть скажет «всем привет» чату','Спроси, какая у него любимая песня','Прочитай вслух: ты сегодня лучший!','Пусть станцует 10 секунд 💃','Спроси, верит ли он в инопланетян 👽','Вы оба в прямом эфире, улыбнитесь!','Спроси совет, как стать счастливым','Держи на шаурму 🌯','Задай ему вопрос: кошки или собаки?'];
let goal=ri(2500,6000);const goalMax=15000;
function upd(){$('gnow').textContent=fmt(goal)+' ₽';$('gbar').style.width=Math.min(100,goal/goalMax*100)+'%'}
upd();
const q=[];let busy=false;
function show(g,t,m){q.push([g,t,m]);if(!busy)next()}
function next(){if(!q.length){busy=false;return}busy=true;const[g,t,m]=q.shift();$('ag').textContent=g;$('at').innerHTML=t;$('am').textContent=m;$('alert').classList.add('show');ding();speak(m);
  setTimeout(()=>{$('alert').classList.remove('show');setTimeout(next,500)},6500)}
function donate(){const u=rnd(users),sum=Math.random()<.08?rnd([500,777,1000]):rnd([50,50,69,100,100,100,150,200,228,300]),m=rnd(donMsgs);
  goal+=sum;upd();add(`💰 <b>${u}</b> — <b>${sum} ₽</b>: ${esc(m)}`,'don');show(sum>=500?'💎':rnd(['💸','💰','🤑','🎉']),`<em>${u}</em> — ${sum} ₽`,m);
  setTimeout(donate,ri(25000,50000))}
setTimeout(donate,ri(6000,10000));

/* --- sound: unlocked by the first tap anywhere --- */
let ac=null,sound=false;
function unlock(){if(sound)return;sound=true;$('hint').style.opacity=0;setTimeout(()=>$('hint').remove(),600);try{ac=new(window.AudioContext||window.webkitAudioContext)();speechSynthesis&&speechSynthesis.speak(new SpeechSynthesisUtterance(''))}catch(e){}}
addEventListener('pointerdown',unlock,{once:false});
setTimeout(()=>{const h=$('hint');if(h)h.style.opacity=0},6000);
function ding(){if(!sound||!ac)return;try{const n=ac.currentTime;[988,1319,1760].forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(0,n+i*.1);g.gain.linearRampToValueAtTime(.2,n+i*.1+.02);g.gain.exponentialRampToValueAtTime(.001,n+i*.1+.45);o.connect(g).connect(ac.destination);o.start(n+i*.1);o.stop(n+i*.1+.5)})}catch(e){}}
function speak(t){if(!sound||!window.speechSynthesis)return;setTimeout(()=>{try{const u=new SpeechSynthesisUtterance(t);u.lang='ru-RU';u.rate=1.05;speechSynthesis.speak(u)}catch(e){}},800)}
</script>
</body>
</html>
